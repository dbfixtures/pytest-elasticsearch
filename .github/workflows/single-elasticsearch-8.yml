name: Run pytest tests on elasticsearch 8

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]'
        required: false
        type: string
      elastic-versions:
        description: 'Elasticsearch versions'
        required: true
        type: string
      os:
        description: 'Operating system to run tests on'
        default: 'ubuntu-latest'
        required: false
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false


jobs:
  elasticsearch:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        elastic-version: ${{ fromJSON(inputs.elastic-versions) }}
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ matrix.python-version }}
      ELASTIC_VERSION: ${{ matrix.elastic-version }}
      ES_JAVA_OPTS: "-Xms256m -Xmx512m"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv with python ${{ matrix.python-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-setup@2ab3c94b032a11fca1238ef134690e589616739d # v5.7.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/elasticsearch
          key: elasticsearch-${{ matrix.elastic-version }}
      - name: Setup elasticsearch
        uses: ankane/setup-elasticsearch@b9bcd8dd01414bfe450cc620445e3b1203da3ee2 # v1
        with:
          elasticsearch-version: ${{ matrix.elastic-version }}
      - name: Downgrade elasticsearch
        uses: fizyk/actions-reuse/.github/actions/uv-pip@ef34949dba56816730c78752529724b4aa96e557 # v5.8.0
        with:
          packages: elasticsearch<9
      - name: Check free memory
        run: free -h
      - name: Run tests without xdist
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@2ab3c94b032a11fca1238ef134690e589616739d # v5.7.0
        with:
          pytest-opts: --elasticsearch-executable=$ES_HOME/bin/elasticsearch -p no:xdist
          data-file: .coverage.serial
          output-file: coverage-serial.xml
      - name: Run xdist test
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@2ab3c94b032a11fca1238ef134690e589616739d # v5.7.0
        with:
          pytest-opts: --elasticsearch-executable=$ES_HOME/bin/elasticsearch -n auto --max-worker-restart=0
          coverage-config: .coveragerc
          data-file: .coverage.xdist
          output-file: coverage-xdist.xml
      - name: Upload Elasticsearch logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: elasticsearch-logs-${{ runner.os }}-py${{ matrix.python-version }}-es${{ matrix.elastic-version }}
          path: /tmp/pytest-of-runner/**/logs
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: coverage-serial.xml,coverage-xdist.xml
          token: ${{ secrets.codecov_token }}
          flags: linux,elastic-${{ matrix.elastic-version }}
          env_vars: OS,PYTHON,ELASTIC_VERSION
          fail_ci_if_error: false
