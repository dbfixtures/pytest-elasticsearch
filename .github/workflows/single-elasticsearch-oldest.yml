name: Run pytest tests with oldest dependencies

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.11", "3.12", "3.13", "3.14", "3.15", "pypy-3.11"]'
        required: false
        type: string
      elastic-versions:
        description: 'Elasticsearch versions'
        required: true
        type: string
      os:
        description: 'Operating system to run tests on'
        default: 'ubuntu-latest'
        required: false
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false


jobs:
  elasticsearch:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        elastic-version: ${{ fromJSON(inputs.elastic-versions) }}
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ matrix.python-version }}
      ELASTIC_VERSION: ${{ matrix.elastic-version }}
      ES_JAVA_OPTS: "-Xms256m -Xmx512m"
      ELASTIC_PASSWORD: elastic-ci-password
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv with python ${{ matrix.python-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-setup@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/elasticsearch
          key: elasticsearch-${{ matrix.elastic-version }}
      - name: Setup elasticsearch
        uses: ankane/setup-elasticsearch@b9bcd8dd01414bfe450cc620445e3b1203da3ee2 # v1
        with:
          elasticsearch-version: ${{ matrix.elastic-version }}
      - name: Set up uv with python ${{ matrix.python-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-setup@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
        with:
          python-version: ${{ matrix.python-version }}
          cache: false
      - name: Install oldest supported versions
        uses: fizyk/actions-reuse/.github/actions/uv-pip@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
        with:
          requirements: oldest/requirements.txt
      - name: Check free memory
        run: free -h

      - name: Run tests without xdist
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
        with:
          pytest-opts: -c pyproject.oldest.toml --elasticsearch-executable=$ES_HOME/bin/elasticsearch -p no:xdist -k "not docker"
          data-file: .coverage.serial
          output-file: coverage-serial.xml
      - name: Run xdist test
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
        with:
          pytest-opts: -c pyproject.oldest.toml --elasticsearch-executable=$ES_HOME/bin/elasticsearch -n auto --max-worker-restart=0 -k "not docker"
          coverage-config: .coveragerc
          data-file: .coverage.xdist
          output-file: coverage-xdist.xml
      # Same version as the binary above, with security enabled, for the noproc fixture tests (-k docker)
      - name: Start elasticsearch with authentication in docker
        timeout-minutes: 5
        run: |
          version=$("$ES_HOME/bin/elasticsearch" --version | grep -oP 'Version: \K[0-9]+\.[0-9]+\.[0-9]+')
          docker run -d --name elasticsearch-auth -p 9250:9200 \
            -e discovery.type=single-node \
            -e ELASTIC_PASSWORD="$ELASTIC_PASSWORD" \
            -e xpack.security.enabled=true \
            -e xpack.security.http.ssl.enabled=false \
            -e ES_JAVA_OPTS="$ES_JAVA_OPTS" \
            "elasticsearch:$version"
          until curl -fs -u "elastic:$ELASTIC_PASSWORD" \
            "http://localhost:9250/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null; do
            sleep 5
          done
      - name: Run tests with basic authentication
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
        with:
          pytest-opts: -c pyproject.oldest.toml -p no:xdist -k docker --elasticsearch-port=9250 --elasticsearch-basic-auth=elastic:$ELASTIC_PASSWORD
          data-file: .coverage.docker-basic-auth
          output-file: coverage-docker-basic-auth.xml
      - name: Create API key
        run: |
          api_key=$(curl -fs -u "elastic:$ELASTIC_PASSWORD" -X POST http://localhost:9250/_security/api_key \
            -H 'Content-Type: application/json' -d '{"name": "pytest-elasticsearch"}' | jq -r .encoded)
          echo "::add-mask::$api_key"
          echo "ELASTICSEARCH_API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Run tests with API key
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
        with:
          pytest-opts: -c pyproject.oldest.toml -p no:xdist -k docker --elasticsearch-port=9250 --elasticsearch-api-key=$ELASTICSEARCH_API_KEY
          data-file: .coverage.docker-api-key
          output-file: coverage-docker-api-key.xml
      - name: Upload Elasticsearch logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: elasticsearch-logs-${{ runner.os }}-py${{ matrix.python-version }}-es${{ matrix.elastic-version }}
          path: /tmp/pytest-of-runner/**/logs
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-serial.xml,coverage-xdist.xml,coverage-docker-basic-auth.xml,coverage-docker-api-key.xml
          token: ${{ secrets.codecov_token }}
          flags: linux,elastic-${{ matrix.elastic-version }}
          env_vars: OS,PYTHON,ELASTIC_VERSION
          fail_ci_if_error: false
